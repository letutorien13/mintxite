[mint]
install_command = """
if apt-cache show ghostty >/dev/null 2>&1; then
    sudo apt-get install -y ghostty
else
    sudo add-apt-repository -y ppa:mkasberg/ghostty-ubuntu
    sudo apt-get update
    sudo apt-get install -y ghostty
fi
"""

[arch]
install_system = "ghostty"

[fedora]
dependencies = ["fedora-ghostty"]
install_system = "ghostty"

[ubuntu]
install_system = "ghostty"
snap = "classic"

[debian]
dependencies = ["apt-ghostty"]
install_system = "ghostty"
